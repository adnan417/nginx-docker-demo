worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream nodejs_clusters{
        least_conn;
        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://nodejs_clusters;
        }
    }
}