<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image preview</title>
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f7f7f7; }
      .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); max-width: 90vw; }
      img { display: block; max-width: 80vw; height: auto; border-radius: 6px; }
      .caption { margin-top: 8px; color: #444; font-size: 14px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="images/joeroot.jpg" alt="Joe Root" />
      <div class="caption">Image: <code>images/joeroot.jpg</code></div>
    </div>
  </body>
</html>
